<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M50 10 L80 25 L80 55 C80 70 65 85 50 90 C35 85 20 70 20 55 L20 25 Z" 
        stroke="url(#cyberGrad)" 
        stroke-width="3" 
        fill="#0a0a0a"/>
  
  <!-- Inner Circuit Pattern -->
  <circle cx="50" cy="50" r="15" stroke="url(#cyberGrad)" stroke-width="2" fill="none"/>
  <circle cx="50" cy="50" r="5" fill="url(#cyberGrad)"/>
  
  <!-- Circuit Lines -->
  <line x1="50" y1="35" x2="50" y2="25" stroke="url(#cyberGrad)" stroke-width="2"/>
  <line x1="65" y1="50" x2="75" y2="50" stroke="url(#cyberGrad)" stroke-width="2"/>
  <line x1="50" y1="65" x2="50" y2="75" stroke="url(#cyberGrad)" stroke-width="2"/>
  <line x1="35" y1="50" x2="25" y2="50" stroke="url(#cyberGrad)" stroke-width="2"/>
  
  <!-- Corner Nodes -->
  <circle cx="50" cy="25" r="3" fill="#00ff41"/>
  <circle cx="75" cy="50" r="3" fill="#00ff41"/>
  <circle cx="50" cy="75" r="3" fill="#00e5ff"/>
  <circle cx="25" cy="50" r="3" fill="#00e5ff"/>
</svg>
