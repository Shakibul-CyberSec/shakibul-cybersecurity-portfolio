version: 2
updates:
  # 1. For npm (Next.js and JS dependencies)
  - package-ecosystem: "npm" # For Node.js projects
    directory: "/"            # Root directory where package.json is located
    schedule:
      interval: "weekly"      # Check for updates every week
    open-pull-requests-limit: 5 # Limit open PRs to avoid too many
    versioning-strategy: "auto" # Use semantic versioning (default)
    labels:
      - "dependencies"
      - "npm"
    assignees:
      - "shakibul"            # Assign PRs to you (optional)

  # 2. GitHub Actions (Optional: If you use CI/CD workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
      

  

